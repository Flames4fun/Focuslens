<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FocusLens local demo storyboard</title>
  <desc id="desc">A static storyboard showing the local webcam overlay, saved session summary, and Streamlit dashboard.</desc>
  <rect width="1200" height="680" fill="#050507"/>
  <rect x="34" y="34" width="1132" height="612" rx="18" fill="#0d0e12" stroke="#ff2d3d" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M34 142H1166" stroke="#ff2d3d" stroke-opacity="0.22"/>
  <text x="70" y="93" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">FocusLens local session flow</text>
  <text x="70" y="123" fill="#a9afbb" font-family="Segoe UI, Arial, sans-serif" font-size="16">Webcam frames stay in memory. Only aggregate JSON and CSV summaries are stored locally.</text>

  <g transform="translate(70 185)">
    <rect width="320" height="365" rx="12" fill="#12141b" stroke="#ff2d3d" stroke-opacity="0.45"/>
    <rect x="22" y="24" width="276" height="184" rx="10" fill="#08090d" stroke="#2d313b"/>
    <circle cx="160" cy="104" r="58" fill="#1f2430" stroke="#ff2d3d" stroke-width="4"/>
    <circle cx="139" cy="92" r="7" fill="#f6f7fb"/>
    <circle cx="181" cy="92" r="7" fill="#f6f7fb"/>
    <path d="M145 135C154 144 168 144 177 135" stroke="#f6f7fb" stroke-width="5" stroke-linecap="round"/>
    <rect x="42" y="232" width="236" height="38" rx="8" fill="#ff2d3d"/>
    <text x="66" y="257" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Status: FOCUSED</text>
    <text x="42" y="306" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="17">Session: 00:45:00</text>
    <text x="42" y="334" fill="#a9afbb" font-family="Segoe UI, Arial, sans-serif" font-size="15">Focus 73.6%  |  Presence 86.5%</text>
  </g>

  <g transform="translate(440 185)">
    <rect width="320" height="365" rx="12" fill="#12141b" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="28" y="51" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Local summary</text>
    <rect x="28" y="78" width="264" height="230" rx="8" fill="#08090d" stroke="#2d313b"/>
    <text x="48" y="115" fill="#a9afbb" font-family="Consolas, monospace" font-size="15">{</text>
    <text x="70" y="145" fill="#f6f7fb" font-family="Consolas, monospace" font-size="15">"focused_seconds": 1965.0,</text>
    <text x="70" y="174" fill="#f6f7fb" font-family="Consolas, monospace" font-size="15">"away_seconds": 360.0,</text>
    <text x="70" y="203" fill="#f6f7fb" font-family="Consolas, monospace" font-size="15">"looking_away_events": 5,</text>
    <text x="70" y="232" fill="#f6f7fb" font-family="Consolas, monospace" font-size="15">"focus_score": 73.6,</text>
    <text x="70" y="261" fill="#f6f7fb" font-family="Consolas, monospace" font-size="15">"presence_score": 86.52</text>
    <text x="48" y="290" fill="#a9afbb" font-family="Consolas, monospace" font-size="15">}</text>
    <text x="28" y="336" fill="#a9afbb" font-family="Segoe UI, Arial, sans-serif" font-size="15">Written to sessions/*.json and sessions.csv</text>
  </g>

  <g transform="translate(810 185)">
    <rect width="320" height="365" rx="12" fill="#12141b" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="28" y="51" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Dashboard</text>
    <rect x="28" y="82" width="116" height="88" rx="9" fill="#08090d" stroke="#ff2d3d" stroke-opacity="0.35"/>
    <text x="46" y="118" fill="#ff2d3d" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">74%</text>
    <text x="46" y="146" fill="#a9afbb" font-family="Segoe UI, Arial, sans-serif" font-size="14">Focus</text>
    <rect x="176" y="82" width="116" height="88" rx="9" fill="#08090d" stroke="#ff2d3d" stroke-opacity="0.35"/>
    <text x="194" y="118" fill="#f6f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">87%</text>
    <text x="194" y="146" fill="#a9afbb" font-family="Segoe UI, Arial, sans-serif" font-size="14">Presence</text>
    <rect x="28" y="207" width="264" height="108" rx="8" fill="#08090d" stroke="#2d313b"/>
    <rect x="54" y="264" width="28" height="31" rx="4" fill="#ff2d3d"/>
    <rect x="104" y="244" width="28" height="51" rx="4" fill="#d91f31"/>
    <rect x="154" y="224" width="28" height="71" rx="4" fill="#ff6b75"/>
    <rect x="204" y="250" width="28" height="45" rx="4" fill="#7b1d25"/>
    <text x="28" y="344" fill="#a9afbb" font-family="Segoe UI, Arial, sans-serif" font-size="15">Streamlit reads aggregate CSV only</text>
  </g>

  <path d="M403 368H428" stroke="#ff2d3d" stroke-width="4" stroke-linecap="round"/>
  <path d="M428 368L416 356M428 368L416 380" stroke="#ff2d3d" stroke-width="4" stroke-linecap="round"/>
  <path d="M773 368H798" stroke="#ff2d3d" stroke-width="4" stroke-linecap="round"/>
  <path d="M798 368L786 356M798 368L786 380" stroke="#ff2d3d" stroke-width="4" stroke-linecap="round"/>
</svg>
